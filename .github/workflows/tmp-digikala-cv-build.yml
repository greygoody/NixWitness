name: Temporary Digikala CV Build

on:
  push:
    branches:
      - tmp-digikala-cv-20260729
    paths:
      - cv/Goodarz-Firoozi-Zargar-Digikala-CV.tex
      - .github/workflows/tmp-digikala-cv-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-digikala-cv-20260729
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile and inspect
        working-directory: cv
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Goodarz-Firoozi-Zargar-Digikala-CV.tex
          pdflatex -interaction=nonstopmode -halt-on-error Goodarz-Firoozi-Zargar-Digikala-CV.tex
          pdfinfo Goodarz-Firoozi-Zargar-Digikala-CV.pdf > Goodarz-Firoozi-Zargar-Digikala-CV.pdfinfo.txt
          pdftotext -layout Goodarz-Firoozi-Zargar-Digikala-CV.pdf Goodarz-Firoozi-Zargar-Digikala-CV.txt
          {
            echo "Build status: success"
            grep -E '^(Pages|Page size|File size|PDF version):' Goodarz-Firoozi-Zargar-Digikala-CV.pdfinfo.txt || true
            echo "Layout warnings:"
            grep -E 'Overfull|Underfull' Goodarz-Firoozi-Zargar-Digikala-CV.log || echo "none"
          } > Goodarz-Firoozi-Zargar-Digikala-CV-build-report.txt
          test "$(pdfinfo Goodarz-Firoozi-Zargar-Digikala-CV.pdf | awk '/^Pages:/ {print $2}')" = "2"
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/Goodarz-Firoozi-Zargar-Digikala-CV.pdf cv/Goodarz-Firoozi-Zargar-Digikala-CV.pdfinfo.txt cv/Goodarz-Firoozi-Zargar-Digikala-CV.txt cv/Goodarz-Firoozi-Zargar-Digikala-CV-build-report.txt
          git commit -m "chore: compile temporary Digikala CV"
          git push origin HEAD:tmp-digikala-cv-20260729
